<div class="relative w-full h-full flex flex-col bg-neutral-950 overflow-hidden select-none">
  <!-- 3D Canvas Host -->
  <div #canvasContainer class="w-full h-full cursor-grab active:cursor-grabbing"></div>

  <!-- Top Floating 3D Control Bar -->
  <div class="absolute top-4 left-4 z-20 flex items-center gap-2 p-2 bg-neutral-900/90 backdrop-blur-md border border-neutral-800 rounded-xl shadow-2xl">
    <button
      (click)="resetView()"
      class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-neutral-300 hover:text-white bg-neutral-800 hover:bg-neutral-700 rounded-lg transition-colors"
      title="Reset 3D Camera Orbit"
    >
      <mat-icon class="text-sm">center_focus_strong</mat-icon>
      <span>Reset View</span>
    </button>

    <button
      (click)="toggleAutoRotate()"
      [class.bg-amber-500]="state.autoRotate3D()"
      [class.text-neutral-950]="state.autoRotate3D()"
      [class.bg-neutral-800]="!state.autoRotate3D()"
      [class.text-neutral-300]="!state.autoRotate3D()"
      class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium rounded-lg transition-colors"
      title="Toggle Auto Turntable Orbit"
    >
      <mat-icon class="text-sm">360</mat-icon>
      <span>Turntable</span>
    </button>

    <div class="h-4 w-px bg-neutral-800 mx-1"></div>

    <span class="text-xs text-neutral-400 font-mono">
      {{ state.activeMaterial().name }}
    </span>
  </div>

  <!-- Bottom Floating Interactive Fold Slider -->
  <div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-20 w-full max-w-md p-4 bg-neutral-900/90 backdrop-blur-md border border-neutral-800 rounded-2xl shadow-2xl flex flex-col gap-2">
    <div class="flex items-center justify-between text-xs">
      <div class="flex items-center gap-2">
        <mat-icon class="text-amber-400 text-sm">unfold_more</mat-icon>
        <span class="font-semibold text-neutral-200">Assembly Fold Sequence</span>
      </div>
      <span class="font-mono font-bold text-amber-400 text-sm">
        {{ state.foldPercentage() }}%
      </span>
    </div>

    <!-- Stepper Range Slider -->
    <div class="flex items-center gap-3">
      <button
        (click)="updateFold(0)"
        class="px-2 py-1 text-[11px] font-mono text-neutral-400 hover:text-white bg-neutral-800 rounded-md"
      >
        Flat (0%)
      </button>

      <input
        #foldRange
        type="range"
        min="0"
        max="100"
        step="1"
        [value]="state.foldPercentage()"
        (input)="updateFold(+foldRange.value)"
        class="flex-1 accent-amber-400 cursor-ew-resize h-1.5 bg-neutral-800 rounded-lg"
      />

      <button
        (click)="updateFold(100)"
        class="px-2 py-1 text-[11px] font-mono text-neutral-400 hover:text-white bg-neutral-800 rounded-md"
      >
        Formed (100%)
      </button>
    </div>

    <div class="flex items-center justify-between text-[10px] text-neutral-500 font-mono pt-1 border-t border-neutral-800/80">
      <span>Drag mouse to orbit • Scroll to zoom</span>
      <span>Live Three.js WebGL</span>
    </div>
  </div>
</div>
